<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Study Buddy — Plan smarter. Study better. Achieve more.</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root{--bg:#f5f7fb;--surface:#fff;--surface2:#f8fafc;--text:#172033;--muted:#667085;--border:#e6eaf0;--primary:#635bff;--primary2:#5147e8;--success:#12b76a;--warning:#f79009;--danger:#f04438;--shadow:0 8px 28px rgba(16,24,40,.07);--radius:16px}
[data-theme=dark]{--bg:#0f1420;--surface:#171d2b;--surface2:#111724;--text:#eef2f7;--muted:#98a2b3;--border:#293244;--shadow:0 8px 28px rgba(0,0,0,.25)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.app{display:flex;min-height:100vh}.sidebar{width:250px;background:var(--surface);border-right:1px solid var(--border);position:fixed;inset:0 auto 0 0;z-index:20;transition:.2s;overflow:auto}.brand{height:72px;display:flex;align-items:center;gap:11px;padding:0 20px;font-weight:800;font-size:18px;border-bottom:1px solid var(--border)}.brand-mark{width:36px;height:36px;border-radius:11px;background:var(--primary);color:white;display:grid;place-items:center}.nav{padding:14px 10px}.nav button{width:100%;display:flex;gap:11px;align-items:center;padding:10px 12px;margin:2px 0;background:transparent;color:var(--muted);border-radius:10px;text-align:left}.nav button:hover,.nav button.active{background:color-mix(in srgb,var(--primary) 10%,transparent);color:var(--primary);font-weight:650}.nav .section{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:14px 12px 5px}.main{margin-left:250px;width:calc(100% - 250px)}.topbar{height:72px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 26px;position:sticky;top:0;z-index:10}.top-left,.top-right{display:flex;align-items:center;gap:12px}.page-title{font-size:20px;font-weight:750}.icon-btn{width:38px;height:38px;border-radius:10px;background:var(--surface2);color:var(--muted);display:grid;place-items:center}.search{display:flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:8px 11px;width:230px}.search input{border:0;outline:0;background:transparent;color:var(--text);width:100%}.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--primary);color:white;font-weight:700}.content{padding:26px;max-width:1500px;margin:auto}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,1fr)}.two{grid-template-columns:1.45fr 1fr}.three{grid-template-columns:repeat(3,1fr)}.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}.hero{background:linear-gradient(120deg,var(--primary),#8b83ff);color:white;border:0}.hero .muted{color:#eee}.muted{color:var(--muted)}.eyebrow{font-size:12px;color:var(--muted);font-weight:650;text-transform:uppercase;letter-spacing:.06em}.metric{font-size:28px;font-weight:800;margin:4px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.wrap{display:flex;gap:8px;flex-wrap:wrap}.btn{padding:9px 13px;border-radius:10px;background:var(--surface2);color:var(--text);border:1px solid var(--border);font-weight:650}.btn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}.btn.success{background:var(--success);color:#fff}.btn.danger{color:var(--danger)}.btn.sm{padding:6px 9px;font-size:12px}.progress{height:8px;background:var(--border);border-radius:99px;overflow:hidden}.progress>i{display:block;height:100%;background:var(--primary);border-radius:99px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:12px 9px;border-bottom:1px solid var(--border);text-align:left}.table th{font-size:12px;color:var(--muted)}.badge{display:inline-flex;padding:4px 8px;border-radius:99px;background:var(--surface2);font-size:11px;font-weight:700}.badge.success{color:var(--success);background:color-mix(in srgb,var(--success) 10%,transparent)}.badge.warning{color:var(--warning);background:color-mix(in srgb,var(--warning) 10%,transparent)}.badge.danger{color:var(--danger);background:color-mix(in srgb,var(--danger) 10%,transparent)}.list{display:grid;gap:10px}.item{padding:12px;border:1px solid var(--border);border-radius:12px;background:var(--surface2)}h2{font-size:17px;margin:0 0 14px}h3{margin:0 0 5px}.empty{text-align:center;padding:40px 15px;color:var(--muted)}.toolbar{display:flex;gap:9px;justify-content:space-between;align-items:center;margin-bottom:18px}.toolbar .actions{display:flex;gap:8px}.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.48);display:none;place-items:center;z-index:100;padding:20px}.modal-back.show{display:grid}.modal{background:var(--surface);border:1px solid var(--border);width:min(620px,100%);max-height:90vh;overflow:auto;border-radius:18px;padding:22px}.form{display:grid;gap:12px}.form label{font-weight:650;font-size:13px}.form input,.form select,.form textarea{width:100%;padding:10px 11px;border:1px solid var(--border);border-radius:10px;background:var(--surface2);color:var(--text);outline:none}.form textarea{min-height:120px;resize:vertical}.form input:focus,.form select:focus,.form textarea:focus{border-color:var(--primary)}.toast{position:fixed;right:22px;bottom:22px;background:var(--text);color:var(--surface);padding:12px 15px;border-radius:11px;box-shadow:var(--shadow);z-index:200;display:none}.toast.show{display:block}.timer{text-align:center}.timer-face{font-size:64px;font-weight:800;letter-spacing:-2px;margin:18px 0}.timer-ring{width:210px;height:210px;border-radius:50%;border:12px solid var(--border);display:grid;place-items:center;margin:10px auto}.flash{min-height:210px;display:grid;place-items:center;text-align:center;border:1px dashed var(--border);border-radius:16px;padding:25px}.chat{height:390px;overflow:auto;display:grid;align-content:start;gap:10px;padding:8px}.msg{max-width:82%;padding:10px 13px;border-radius:13px;background:var(--surface2)}.msg.me{margin-left:auto;background:var(--primary);color:#fff}.chat-input{display:flex;gap:8px;margin-top:10px}.chat-input input{flex:1;padding:11px;border:1px solid var(--border);border-radius:10px;background:var(--surface2);color:var(--text)}.chart-wrap{height:280px}.hide{display:none!important}.mobile-menu{display:none}.notice{padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--warning) 10%,transparent);color:var(--warning);font-size:12px}.kpi-icon{width:40px;height:40px;border-radius:12px;background:color-mix(in srgb,var(--primary) 11%,transparent);color:var(--primary);display:grid;place-items:center}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.day{min-height:100px;padding:8px;border:1px solid var(--border);border-radius:10px;background:var(--surface2)}.day b{font-size:11px;color:var(--muted)}.task-pill{font-size:11px;padding:5px;border-radius:6px;background:color-mix(in srgb,var(--primary) 12%,transparent);margin-top:5px}.section-gap{margin-top:18px}
@media(max-width:1000px){.stats{grid-template-columns:repeat(2,1fr)}.two,.three{grid-template-columns:1fr}.search{width:180px}}
@media(max-width:760px){.sidebar{transform:translateX(-100%)}.sidebar.open{transform:translateX(0);box-shadow:var(--shadow)}.main{margin-left:0;width:100%}.mobile-menu{display:grid}.topbar{padding:0 14px}.content{padding:16px}.search{display:none}.top-right .streak{display:none}.stats{grid-template-columns:1fr 1fr}.page-title{font-size:17px}.table-wrap{overflow:auto}.calendar{min-width:680px}.calendar-wrap{overflow:auto}}
@media(max-width:480px){.stats{grid-template-columns:1fr}.topbar{height:64px}.hero .row{align-items:flex-start;flex-direction:column}.timer-face{font-size:50px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="brand"><span class="brand-mark"><i data-lucide="graduation-cap"></i></span> AI Study Buddy</div>
  <nav class="nav" id="nav">
    <div class="section">Workspace</div>
    <button data-page="dashboard" class="active"><i data-lucide="layout-dashboard"></i>Dashboard</button>
    <button data-page="subjects"><i data-lucide="book-open"></i>My Subjects</button>
    <button data-page="planner"><i data-lucide="calendar-days"></i>Study Planner</button>
    <button data-page="sessions"><i data-lucide="timer"></i>Study Sessions</button>
    <button data-page="notes"><i data-lucide="notebook-pen"></i>Notes</button>
    <button data-page="flashcards"><i data-lucide="layers-3"></i>Flashcards</button>
    <button data-page="quizzes"><i data-lucide="clipboard-check"></i>Quizzes</button>
    <button data-page="materials"><i data-lucide="files"></i>Study Materials</button>
    <div class="section">Insights</div>
    <button data-page="weak"><i data-lucide="target"></i>Weak Topics</button>
    <button data-page="goals"><i data-lucide="flag"></i>Goals</button>
    <button data-page="progress"><i data-lucide="chart-no-axes-combined"></i>Progress</button>
    <button data-page="achievements"><i data-lucide="trophy"></i>Achievements</button>
    <button data-page="assistant"><i data-lucide="bot"></i>AI Assistant</button>
    <div class="section">System</div>
    <button data-page="settings"><i data-lucide="settings"></i>Settings</button>
  </nav>
</aside>
<main class="main">
<header class="topbar">
  <div class="top-left"><button class="icon-btn mobile-menu" id="menu"><i data-lucide="menu"></i></button><div class="page-title" id="pageTitle">Dashboard</div></div>
  <div class="top-right">
    <div class="search"><i data-lucide="search" size="16"></i><input id="globalSearch" placeholder="Search everything..."></div>
    <button class="icon-btn" id="notifBtn" title="Notifications"><i data-lucide="bell"></i></button>
    <span class="streak badge">🔥 <b id="streakTop">0</b> day streak</span>
    <button class="icon-btn" id="themeBtn"><i data-lucide="moon"></i></button>
    <div class="avatar" id="avatar">S</div>
  </div>
</header>
<div class="content" id="view"></div>
</main>
</div>

<div class="modal-back" id="modalBack"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
const KEY='aiStudyBuddy';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const iso=d=>new Date(d).toISOString().slice(0,10);
const today=()=>iso(new Date());
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const fmtMin=m=>{m=Math.round(m||0);return `${Math.floor(m/60)}h ${m%60}m`};
const daysAgo=d=>{if(!d)return 'Never';const n=Math.floor((Date.now()-new Date(d).getTime())/86400000);return n<=0?'Today':`${n} day${n===1?'':'s'} ago`};
const pct=(a,b)=>b?Math.min(100,Math.max(0,Math.round(a/b*100))):0;

const seed={
 userProfile:{name:'Student',target:'Python Developer',level:'Beginner'},
 subjects:[
  {id:'s1',name:'Python',description:'Programming fundamentals and development',color:'#635bff',targetHours:20,studiedHours:17,topicsTotal:5,created:today()},
  {id:'s2',name:'Data Structures',description:'Algorithms and core data structures',color:'#12b76a',targetHours:16,studiedHours:11,topicsTotal:4,created:today()},
  {id:'s3',name:'Mathematics',description:'Probability and statistics',color:'#f79009',targetHours:15,studiedHours:8,topicsTotal:4,created:today()},
  {id:'s4',name:'Computer Science',description:'Core CS concepts',color:'#7f56d9',targetHours:12,studiedHours:7,topicsTotal:3,created:today()},
  {id:'s5',name:'English',description:'Communication and vocabulary',color:'#06aed4',targetHours:8,studiedHours:5,topicsTotal:2,created:today()}
 ],
 topics:[
  {id:'t1',subjectId:'s1',name:'Python Functions',status:'Completed',difficulty:'Easy',progress:100,score:91,lastStudied:today(),studyTime:240},
  {id:'t2',subjectId:'s1',name:'OOP',status:'In Progress',difficulty:'Medium',progress:80,score:88,lastStudied:iso(Date.now()-86400000),studyTime:180},
  {id:'t3',subjectId:'s1',name:'Lists & Dictionaries',status:'Completed',difficulty:'Easy',progress:100,score:94,lastStudied:iso(Date.now()-172800000),studyTime:150},
  {id:'t4',subjectId:'s2',name:'Algorithms',status:'In Progress',difficulty:'Hard',progress:65,score:82,lastStudied:iso(Date.now()-259200000),studyTime:180},
  {id:'t5',subjectId:'s2',name:'Trees',status:'Needs Revision',difficulty:'Hard',progress:55,score:69,lastStudied:iso(Date.now()-432000000),studyTime:120},
  {id:'t6',subjectId:'s3',name:'Probability',status:'Needs Revision',difficulty:'Hard',progress:45,score:54,lastStudied:iso(Date.now()-432000000),studyTime:75},
  {id:'t7',subjectId:'s3',name:'Statistics',status:'In Progress',difficulty:'Medium',progress:60,score:67,lastStudied:iso(Date.now()-259200000),studyTime:90},
  {id:'t8',subjectId:'s4',name:'Operating Systems',status:'In Progress',difficulty:'Medium',progress:55,score:76,lastStudied:iso(Date.now()-172800000),studyTime:100}
 ],
 studyTasks:[
  {id:'a1',title:'Functions & OOP',subjectId:'s1',topicId:'t2',date:today(),start:'09:00',duration:60,priority:'High',status:'Pending'},
  {id:'a2',title:'Probability revision',subjectId:'s3',topicId:'t6',date:today(),start:'11:00',duration:45,priority:'High',status:'Pending'},
  {id:'a3',title:'Trees practice',subjectId:'s2',topicId:'t5',date:today(),start:'16:00',duration:60,priority:'Medium',status:'Pending'},
  {id:'a4',title:'English vocabulary',subjectId:'s5',date:today(),start:'19:00',duration:30,priority:'Low',status:'Pending'}
 ],
 studySessions:[],notes:[
  {id:'n1',title:'Python OOP Revision',content:'Classes, objects, inheritance, polymorphism and encapsulation.',subjectId:'s1',topicId:'t2',tags:['python','oop'],created:today(),updated:today(),pinned:true,favorite:true},
  {id:'n2',title:'Probability formulas',content:'Review conditional probability and Bayes theorem.',subjectId:'s3',topicId:'t6',tags:['math'],created:iso(Date.now()-86400000),updated:today(),pinned:false,favorite:true}
 ],
 flashcardDecks:[{id:'d1',name:'Python Basics',subjectId:'s1'}],
 flashcards:[
  {id:'f1',deckId:'d1',question:'What is a Python list?',answer:'An ordered, mutable collection that can contain multiple values.',subjectId:'s1',topicId:'t3',reviewed:0,correct:0,incorrect:0},
  {id:'f2',deckId:'d1',question:'What is inheritance?',answer:'A mechanism where a class derives attributes and behavior from another class.',subjectId:'s1',topicId:'t2',reviewed:0,correct:0,incorrect:0},
  {id:'f3',deckId:'d1',question:'What is a dictionary?',answer:'A mutable mapping of keys to values.',subjectId:'s1',topicId:'t3',reviewed:0,correct:0,incorrect:0}
 ],
 quizzes:[
  {id:'q1',name:'Python Fundamentals',subjectId:'s1',topicId:'t1',questions:[
   {question:'Which keyword defines a function?',options:['func','def','function','lambda'],answer:1,explanation:'def defines a named function.'},
   {question:'Which type is mutable?',options:['tuple','string','list','int'],answer:2,explanation:'Lists are mutable.'},
   {question:'What does len() return?',options:['Memory size','Number of items','Data type','Last item'],answer:1,explanation:'len returns the number of items.'}
  ]},
  {id:'q2',name:'Probability Basics',subjectId:'s3',topicId:'t6',questions:[
   {question:'Probability is always between:',options:['-1 and 1','0 and 1','1 and 100','-100 and 100'],answer:1,explanation:'Probability ranges from 0 to 1.'},
   {question:'A certain event has probability:',options:['0','0.5','1','-1'],answer:2,explanation:'A certain event has probability 1.'}
  ]}
 ],
 quizResults:[],
 materials:[],goals:[
  {id:'g1',title:'Study Python for 20 hours',description:'Build a consistent Python routine',target:20,current:17,deadline:iso(Date.now()+10*86400000),type:'Subject',status:'Active'},
  {id:'g2',title:'Complete 5 Mathematics chapters',description:'Finish probability and statistics',target:5,current:2,deadline:iso(Date.now()+20*86400000),type:'Monthly',status:'Active'},
  {id:'g3',title:'Maintain a 14-day streak',description:'Study every day',target:14,current:7,deadline:iso(Date.now()+14*86400000),type:'Daily',status:'Active'}
 ],
 achievements:[],notifications:[
  {id:uid(),text:'Your Mathematics topic needs revision.',read:false,date:new Date().toISOString()},
  {id:uid(),text:'You have a study session scheduled today.',read:false,date:new Date().toISOString()}
 ],settings:{theme:'light',sampleData:true,weeklyTarget:25},activityLog:[]
};
let state, page='dashboard', charts={}, timer={seconds:1500,running:false,interval:null,mode:'Study',subjectId:'s1',topicId:'t2',start:null}, flashIndex=0, flashFlipped=false, currentQuiz=null;

function load(){try{const raw=localStorage.getItem(KEY);state=raw?JSON.parse(raw):structuredClone(seed)}catch(e){state=structuredClone(seed)}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){toast('Could not save: browser storage is unavailable.')}}
function log(action){state.activityLog.unshift({id:uid(),action,date:new Date().toISOString()});state.activityLog=state.activityLog.slice(0,100);save()}
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2400)}
function subj(id){return state.subjects.find(x=>x.id===id)}
function topic(id){return state.topics.find(x=>x.id===id)}
function renderIcons(){if(window.lucide)lucide.createIcons()}
function showModal(title,body,buttons=''){document.getElementById('modal').innerHTML=`<div class="row"><h2>${title}</h2><button class="icon-btn" onclick="closeModal()"><i data-lucide="x"></i></button></div>${body}${buttons?`<div class="row" style="justify-content:flex-end;margin-top:16px">${buttons}</div>`:''}`;document.getElementById('modalBack').classList.add('show');renderIcons()}
function closeModal(){document.getElementById('modalBack').classList.remove('show')}
function confirmBox(text,fn){showModal('Confirm action',`<p>${esc(text)}</p>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn danger" onclick="closeModal();(${fn.toString()})()">Delete</button>`)}
function setPage(p){page=p;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));document.getElementById('pageTitle').textContent=p==='weak'?'Weak Topics':p==='assistant'?'AI Assistant':p.charAt(0).toUpperCase()+p.slice(1);document.getElementById('sidebar').classList.remove('open');render();window.scrollTo(0,0)}
function openForm(type,id=''){
 const existing=id?(
  type==='subject'?subj(id):type==='topic'?topic(id):type==='task'?state.studyTasks.find(x=>x.id===id):type==='note'?state.notes.find(x=>x.id===id):type==='goal'?state.goals.find(x=>x.id===id):null):null;
 const escv=x=>esc(x??'');
 let fields='';
 if(type==='subject')fields=`<label>Name<input id="f_name" value="${escv(existing?.name)}" required></label><label>Description<input id="f_desc" value="${escv(existing?.description)}"></label><label>Target hours<input id="f_target" type="number" min="1" value="${existing?.targetHours||10}"></label>`;
 if(type==='topic')fields=`<label>Subject<select id="f_subject">${state.subjects.map(s=>`<option value="${s.id}" ${existing?.subjectId===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></label><label>Topic name<input id="f_name" value="${escv(existing?.name)}" required></label><label>Difficulty<select id="f_diff">${['Easy','Medium','Hard'].map(x=>`<option ${existing?.difficulty===x?'selected':''}>${x}</option>`).join('')}</select></label><label>Progress %<input id="f_progress" type="number" min="0" max="100" value="${existing?.progress||0}"></label>`;
 if(type==='task')fields=`<label>Title<input id="f_name" value="${escv(existing?.title)}" required></label><label>Subject<select id="f_subject">${state.subjects.map(s=>`<option value="${s.id}" ${existing?.subjectId===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></label><label>Topic<select id="f_topic">${state.topics.map(t=>`<option value="${t.id}" ${existing?.topicId===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select></label><label>Date<input id="f_date" type="date" value="${existing?.date||today()}"></label><label>Start time<input id="f_time" type="time" value="${existing?.start||'09:00'}"></label><label>Duration (minutes)<input id="f_duration" type="number" min="5" value="${existing?.duration||30}"></label><label>Priority<select id="f_priority">${['Low','Medium','High'].map(x=>`<option ${existing?.priority===x?'selected':''}>${x}</option>`).join('')}</select></label>`;
 if(type==='note')fields=`<label>Title<input id="f_name" value="${escv(existing?.title)}" required></label><label>Subject<select id="f_subject"><option value="">General</option>${state.subjects.map(s=>`<option value="${s.id}" ${existing?.subjectId===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></label><label>Tags<input id="f_tags" value="${escv(existing?.tags?.join(', '))}" placeholder="python, revision"></label><label>Content<textarea id="f_content">${esc(existing?.content)}</textarea></label>`;
 if(type==='goal')fields=`<label>Title<input id="f_name" value="${escv(existing?.title)}" required></label><label>Description<input id="f_desc" value="${escv(existing?.description)}"></label><label>Target<input id="f_target" type="number" min="1" value="${existing?.target||10}"></label><label>Current progress<input id="f_current" type="number" min="0" value="${existing?.current||0}"></label><label>Deadline<input id="f_deadline" type="date" value="${existing?.deadline||iso(Date.now()+7*86400000)}"></label><label>Type<select id="f_type">${['Daily','Weekly','Monthly','Subject','Exam'].map(x=>`<option ${existing?.type===x?'selected':''}>${x}</option>`).join('')}</select></label>`;
 showModal((id?'Edit ':'Add ')+type[0].toUpperCase()+type.slice(1),`<form class="form" id="dynamicForm">${fields}</form>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="submitForm('${type}','${id}')">Save</button>`);
}
function submitForm(type,id){
 const v=id=>document.getElementById(id)?.value;
 if(type==='subject'){const x=id?subj(id):{id:uid(),studiedHours:0,topicsTotal:0,created:today()};Object.assign(x,{name:v('f_name'),description:v('f_desc'),targetHours:+v('f_target'),color:x.color||'#635bff'});if(!id)state.subjects.push(x)}
 if(type==='topic'){const x=id?topic(id):{id:uid(),score:0,studyTime:0,lastStudied:null};Object.assign(x,{subjectId:v('f_subject'),name:v('f_name'),difficulty:v('f_diff'),progress:+v('f_progress'),status:+v('f_progress')>=100?'Completed':+v('f_progress')>0?'In Progress':'Not Started'});if(!id)state.topics.push(x)}
 if(type==='task'){const x=id?state.studyTasks.find(z=>z.id===id):{id:uid(),status:'Pending'};Object.assign(x,{title:v('f_name'),subjectId:v('f_subject'),topicId:v('f_topic'),date:v('f_date'),start:v('f_time'),duration:+v('f_duration'),priority:v('f_priority')});if(!id)state.studyTasks.push(x)}
 if(type==='note'){const x=id?state.notes.find(z=>z.id===id):{id:uid(),created:today(),pinned:false,favorite:false};Object.assign(x,{title:v('f_name'),subjectId:v('f_subject'),tags:v('f_tags').split(',').map(x=>x.trim()).filter(Boolean),content:v('f_content'),updated:today()});if(!id)state.notes.push(x)}
 if(type==='goal'){const x=id?state.goals.find(z=>z.id===id):{id:uid(),status:'Active'};Object.assign(x,{title:v('f_name'),description:v('f_desc'),target:+v('f_target'),current:+v('f_current'),deadline:v('f_deadline'),type:v('f_type')});if(!id)state.goals.push(x)}
 save();log(`${id?'Updated':'Added'} ${type}`);closeModal();toast(`${id?'Updated':'Added'} successfully`);render();
}
function remove(type,id){if(!confirm('Delete this item?'))return;if(type==='subject'){state.subjects=state.subjects.filter(x=>x.id!==id);state.topics=state.topics.filter(x=>x.subjectId!==id)}else if(type==='topic')state.topics=state.topics.filter(x=>x.id!==id);else if(type==='task')state.studyTasks=state.studyTasks.filter(x=>x.id!==id);else if(type==='note')state.notes=state.notes.filter(x=>x.id!==id);else if(type==='goal')state.goals=state.goals.filter(x=>x.id!==id);else if(type==='material')state.materials=state.materials.filter(x=>x.id!==id);save();toast('Deleted');render()}

function totals(){const mins=state.studySessions.reduce((a,x)=>a+(x.duration||0),0);const weekly=state.studySessions.filter(x=>new Date(x.date)>=new Date(Date.now()-6*86400000)).reduce((a,x)=>a+x.duration,0);const avg=state.quizResults.length?Math.round(state.quizResults.reduce((a,x)=>a+x.score,0)/state.quizResults.length):0;return{mins,weekly,avg}}
function streak(){let dates=new Set(state.studySessions.map(x=>x.date));let n=0,d=new Date();for(let i=0;i<366;i++){let s=iso(d);if(dates.has(s)){n++;d.setDate(d.getDate()-1)}else if(i===0)d.setDate(d.getDate()-1);else break}return n}
function weakTopics(){return [...state.topics].sort((a,b)=>((a.score||0)-(b.score||0))||((b.difficulty==='Hard'?2:1)-(a.difficulty==='Hard'?2:1))).slice(0,5)}
const AIEngine={
 recommendations(){const w=weakTopics()[0];const s=state.subjects.sort((a,b)=>(a.studiedHours/a.targetHours)-(b.studiedHours/b.targetHours))[0];if(w&&w.score<75)return `Your weakest topic is ${w.name} with an average score of ${w.score||0}%. Revise it for 45 minutes and practice 10 questions.`;return `You have studied ${s?.name||'your subjects'} below its target. Consider a focused 45-minute session today.`},
 response(q){q=q.toLowerCase();const w=weakTopics();const t=totals();if(q.includes('weak'))return w.map(x=>`• ${x.name}: ${x.score||0}% (${x.difficulty})`).join('\\n')||'No weak topics yet.';if(q.includes('progress')||q.includes('how am i'))return `You have studied ${fmtMin(t.mins)}, your weekly activity is ${fmtMin(t.weekly)}, and your average quiz score is ${t.avg}%. Your current streak is ${streak()} days.`;if(q.includes('study')||q.includes('today')||q.includes('revise'))return AIEngine.recommendations();if(q.includes('plan'))return `Today: ${state.studyTasks.filter(x=>x.date===today()&&!['Completed'].includes(x.status)).map(x=>`${x.start} ${x.title}`).join(', ')||'No planned tasks'}. Prioritize ${w[0]?.name||'your next topic'}.`;return `I use your local study data. Try asking about your weak topics, progress, what to study today, or a study plan.`}
};

 const t=totals(),st=streak(),weekGoal=state.settings.weeklyTarget*60, wp=pct(t.weekly,weekGoal);
 return `<div class="grid two"><div class="card hero"><div class="row"><div><div class="muted">Good Morning, ${esc(state.userProfile.name)} 👋</div><h1 style="margin:4px 0 7px">Ready to continue learning?</h1><div>Your study progress is improving.</div></div><div class="badge" style="background:rgba(255,255,255,.18);color:#fff">Sample Data</div></div><div class="row" style="margin-top:22px"><div><b>${new Date().toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'})}</b><div class="muted">Target: ${state.settings.weeklyTarget}h/week</div></div><button class="btn" onclick="startTimer()">Quick Start</button></div></div><div class="card"><div class="eyebrow">AI Study Recommendation</div><h3 style="margin-top:7px">🤖 Local Study Assistant</h3><p>${esc(AIEngine.recommendations())}</p><button class="btn primary sm" onclick="setPage('assistant')">Ask AI Buddy</button></div></div>
 <div class="grid stats section-gap">${[['clock-3','Total Study Time',fmtMin(t.mins),'This semester'],['flame','Current Streak',st+' Days','Keep going!'],['target','Weekly Goal',Math.round(t.weekly/60)+' / '+state.settings.weeklyTarget+'h',wp+'%'],['chart-no-axes-combined','Average Quiz Score',t.avg+'%',state.quizResults.length?'+ recent results':'Start your first quiz']].map(x=>`<div class="card"><div class="row"><div><div class="eyebrow">${x[1]}</div><div class="metric">${x[2]}</div><div class="muted">${x[3]}</div></div><div class="kpi-icon"><i data-lucide="${x[0]}"></i></div></div></div>`).join('')}</div>
 <div class="grid two section-gap"><div class="card"><div class="row"><h2>Weekly Study Activity</h2><span class="badge">Live from LocalStorage</span></div><div class="chart-wrap"><canvas id="weeklyChart"></canvas></div></div><div class="card"><h2>AI Insights</h2><div class="list">${insights().map(x=>`<div class="item">${x}</div>`).join('')}</div></div></div>
 <div class="grid two section-gap"><div class="card"><div class="row"><h2>Subject Performance</h2><button class="btn sm" onclick="setPage('subjects')">View all</button></div><div class="list">${state.subjects.slice(0,5).map(s=>{const ts=state.topics.filter(t=>t.subjectId===s.id);const pr=ts.length?Math.round(ts.reduce((a,t)=>a+t.progress,0)/ts.length):0;const sc=ts.length?Math.round(ts.reduce((a,t)=>a+(t.score||0),0)/ts.length):0;return `<div><div class="row"><b>${esc(s.name)}</b><span class="muted">${pr}% · ${sc}% score</span></div><div class="progress"><i style="width:${pr}%"></i></div></div>`}).join('')}</div></div>
 <div class="card"><div class="row"><h2>Today's Study Plan</h2><button class="btn sm" onclick="openForm('task')">+ Add</button></div><div class="list">${todayTasks().map(taskHTML).join('')||`<div class="empty">No study tasks today.</div>`}</div></div></div>`;
}
function insights(){const w=weakTopics()[0],t=totals();return[`📊 ${t.weekly?`You studied ${fmtMin(t.weekly)} this week.`:'Start a study session to build your weekly activity.'}`,`🎯 ${Math.max(0,state.settings.weeklyTarget*60-t.weekly)>0?`You are ${fmtMin(state.settings.weeklyTarget*60-t.weekly)} away from your weekly goal.`:'You completed your weekly goal!'}`,`⚠️ ${w?`${esc(w.name)} has the lowest tracked score at ${w.score||0}%.`:'No weak topic detected yet.'}`,`🔥 You have maintained a ${streak()}-day study streak.`]}
function todayTasks(){return state.studyTasks.filter(x=>x.date===today()).sort((a,b)=>a.start.localeCompare(b.start))}
function taskHTML(x){return `<div class="item"><div class="row"><div><b>${esc(x.start)} · ${esc(x.title)}</b><div class="muted">${esc(subj(x.subjectId)?.name||'General')} · ${x.duration} min</div></div><span class="badge ${x.priority==='High'?'danger':x.priority==='Medium'?'warning':''}">${x.priority}</span></div><div class="wrap" style="margin-top:8px"><button class="btn sm primary" onclick="startTimer('${x.subjectId||''}','${x.topicId||''}',${x.duration})">Start</button>${x.status!=='Completed'?`<button class="btn sm success" onclick="completeTask('${x.id}')">Complete</button>`:''}<button class="btn sm" onclick="openForm('task','${x.id}')">Edit</button><button class="btn sm danger" onclick="remove('task','${x.id}')">Delete</button></div></div>`}
function completeTask(id){const x=state.studyTasks.find(t=>t.id===id);if(x){x.status='Completed';save();toast('Task completed');render()}}

function subjects(){return `<div class="toolbar"><div><div class="eyebrow">Knowledge base</div><h2>My Subjects</h2></div><div class="actions"><button class="btn primary" onclick="openForm('subject')">+ Add Subject</button></div></div><div class="grid three">${state.subjects.map(s=>{const ts=state.topics.filter(t=>t.subjectId===s.id),pr=ts.length?Math.round(ts.reduce((a,t)=>a+t.progress,0)/ts.length):0,sc=ts.length?Math.round(ts.reduce((a,t)=>a+(t.score||0),0)/ts.length):0;return `<div class="card"><div class="row"><div class="kpi-icon"><i data-lucide="book-open"></i></div><span class="badge">Sample Data</span></div><h3 style="margin-top:14px">${esc(s.name)}</h3><p class="muted">${esc(s.description||'')}</p><div class="row"><span>${ts.length} Topics</span><b>${pr}%</b></div><div class="progress"><i style="width:${pr}%"></i></div><div class="row muted" style="margin-top:8px"><span>Target ${s.targetHours}h</span><span>Studied ${s.studiedHours||0}h</span></div><div class="row" style="margin-top:12px"><span class="badge">Score ${sc}%</span><div><button class="btn sm" onclick="openForm('subject','${s.id}')">Edit</button><button class="btn sm danger" onclick="remove('subject','${s.id}')">Delete</button></div></div></div>`}).join('')}</div><div class="card section-gap"><div class="row"><h2>Topics</h2><button class="btn primary" onclick="openForm('topic')">+ Add Topic</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Topic</th><th>Subject</th><th>Status</th><th>Difficulty</th><th>Progress</th><th>Score</th><th></th></tr></thead><tbody>${state.topics.map(t=>`<tr><td><b>${esc(t.name)}</b></td><td>${esc(subj(t.subjectId)?.name||'')}</td><td><span class="badge ${t.status==='Needs Revision'?'danger':t.status==='Completed'?'success':'warning'}">${t.status}</span></td><td>${t.difficulty}</td><td>${t.progress}%</td><td>${t.score||0}%</td><td><button class="btn sm" onclick="openForm('topic','${t.id}')">Edit</button> <button class="btn sm danger" onclick="remove('topic','${t.id}')">Delete</button></td></tr>`).join('')}</tbody></table></div></div>`}

function planner(){const tasks=state.studyTasks;return `<div class="toolbar"><div><div class="eyebrow">Plan your time</div><h2>Study Planner</h2></div><button class="btn primary" onclick="openForm('task')">+ Add Study Task</button></div><div class="card"><div class="row"><div class="wrap"><button class="btn primary sm">Today</button><button class="btn sm">Week</button><button class="btn sm">Month</button></div><div class="wrap"><select class="btn" onchange="filterTasks(this.value)"><option value="">All subjects</option>${state.subjects.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></div></div><div class="calendar-wrap section-gap"><div class="calendar">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<div class="day"><b>${x}</b></div>`).join('')}${tasks.slice(0,14).map(x=>`<div class="day"><b>${x.date}</b><div class="task-pill">${esc(x.start)} ${esc(x.title)}</div></div>`).join('')}</div></div></div><div class="card section-gap"><h2>All Tasks</h2><div class="list" id="taskList">${tasks.map(taskHTML).join('')||'<div class="empty">No tasks.</div>'}</div></div>`}

function sessions(){return `<div class="grid two"><div class="card timer"><div class="eyebrow">Pomodoro-style timer</div><h2>Study Session Timer</h2><div class="timer-ring"><div class="timer-face" id="timerFace">${timeString()}</div></div><div class="wrap" style="justify-content:center"><button class="btn sm" onclick="setTimer(25,'Study')">25 Study</button><button class="btn sm" onclick="setTimer(5,'Break')">5 Break</button><button class="btn sm" onclick="setTimer(50,'Deep Work')">50 Deep</button><button class="btn sm" onclick="setTimer(10,'Break')">10 Break</button></div><div style="margin-top:12px">${state.subjects.map(s=>`<button class="btn sm" onclick="timer.subjectId='${s.id}';timer.topicId='';toast('${esc(s.name)} selected')">${esc(s.name)}</button>`).join('')}</div><div class="wrap" style="justify-content:center;margin-top:18px"><button class="btn primary" onclick="toggleTimer()">${timer.running?'Pause':'Start'}</button><button class="btn" onclick="resetTimer()">Reset</button></div></div><div class="card"><h2>Recent Sessions</h2>${state.studySessions.length?`<div class="list">${state.studySessions.slice(0,10).map(x=>`<div class="item"><div class="row"><b>${esc(subj(x.subjectId)?.name||x.sessionType)}</b><span>${fmtMin(x.duration)}</span></div><div class="muted">${x.date} · ${x.sessionType}</div></div>`).join('')}</div>`:'<div class="empty">Completed sessions will appear here.</div>'}</div></div>`}
function timeString(){let s=Math.max(0,timer.seconds);return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
function setTimer(min,mode){clearInterval(timer.interval);timer.seconds=min*60;timer.mode=mode;timer.running=false;updateTimerUI()}
function startTimer(subjectId='',topicId='',minutes=25){if(subjectId)timer.subjectId=subjectId;if(topicId)timer.topicId=topicId;timer.seconds=minutes*60;timer.mode='Study';timer.running=false;setPage('sessions');toggleTimer()}
function toggleTimer(){if(timer.running){clearInterval(timer.interval);timer.running=false;updateTimerUI();return}timer.running=true;timer.start=new Date().toISOString();timer.interval=setInterval(()=>{timer.seconds--;updateTimerUI();if(timer.seconds<=0){finishTimer()}},1000);updateTimerUI()}
function resetTimer(){clearInterval(timer.interval);timer.running=false;timer.seconds=timer.mode==='Deep Work'?3000:timer.mode==='Break'?300:1500;updateTimerUI()}
function updateTimerUI(){const e=document.getElementById('timerFace');if(e)e.textContent=timeString();const b=document.querySelector('.timer .btn.primary');if(b)b.textContent=timer.running?'Pause':'Start'}
function finishTimer(){clearInterval(timer.interval);timer.running=false;const duration=timer.mode==='Deep Work'?50:timer.mode==='Break'?10:25;const session={id:uid(),subjectId:timer.subjectId,topicId:timer.topicId,duration,date:today(),startTime:timer.start,endTime:new Date().toISOString(),sessionType:timer.mode};if(timer.mode!=='Break'){state.studySessions.unshift(session);const s=subj(timer.subjectId);if(s)s.studiedHours=(s.studiedHours||0)+duration/60;const t=topic(timer.topicId);if(t)t.lastStudied=now();save();log('Completed study session')}toast('Study session completed 🎉');timer.seconds=0;updateTimerUI();render()}

function now(){return new Date().toISOString()}
function notes(){return `<div class="toolbar"><div><div class="eyebrow">Knowledge capture</div><h2>Notes</h2></div><button class="btn primary" onclick="openForm('note')">+ New Note</button></div><div class="grid three">${state.notes.map(n=>`<div class="card"><div class="row"><span class="badge">${n.pinned?'📌 Pinned':'Note'}</span><span>${n.favorite?'⭐':''}</span></div><h3 style="margin-top:12px">${esc(n.title)}</h3><div class="muted">${esc(n.content).slice(0,150)}${n.content.length>150?'…':''}</div><div class="wrap" style="margin-top:12px">${(n.tags||[]).map(t=>`<span class="badge">#${esc(t)}</span>`).join('')}</div><div class="row" style="margin-top:15px"><span class="muted">${n.updated}</span><span><button class="btn sm" onclick="openForm('note','${n.id}')">Edit</button><button class="btn sm danger" onclick="remove('note','${n.id}')">Delete</button></span></div></div>`).join('')||'<div class="empty">Create your first note.</div>'}</div>`}

function flashcards(){const cards=state.flashcards;const c=cards[flashIndex%Math.max(cards.length,1)];return `<div class="toolbar"><div><div class="eyebrow">Active recall</div><h2>Flashcards</h2></div><button class="btn primary" onclick="addFlashcard()">+ Add Flashcard</button></div><div class="grid two"><div class="card"><div class="row"><span class="badge">${cards.length} cards</span><span>${flashIndex+1}/${cards.length||1}</span></div><div class="flash" onclick="flashFlipped=!flashFlipped;render()"><div><div class="eyebrow">${flashFlipped?'Answer':'Question'}</div><h2>${esc(flashFlipped?(c?.answer||'No cards'):c?.question||'No cards')}</h2><div class="muted">Click to flip</div></div></div><div class="wrap" style="justify-content:center;margin-top:14px"><button class="btn" onclick="flashIndex=(flashIndex-1+cards.length)%cards.length;flashFlipped=false;render()">Previous</button><button class="btn primary" onclick="flashIndex=(flashIndex+1)%cards.length;flashFlipped=false;render()">Next</button><button class="btn success" onclick="markCard(true)">Easy</button><button class="btn danger" onclick="markCard(false)">Hard</button></div></div><div class="card"><h2>Review Stats</h2>${c?`<div class="stats grid" style="grid-template-columns:repeat(3,1fr)"><div><b>${c.reviewed||0}</b><div class="muted">Reviewed</div></div><div><b>${c.correct||0}</b><div class="muted">Correct</div></div><div><b>${c.incorrect||0}</b><div class="muted">Incorrect</div></div></div>`:'<div class="empty">Add cards to start.</div>'}<div class="section-gap">${cards.map((x,i)=>`<div class="item row"><span>${esc(x.question)}</span><button class="btn sm" onclick="flashIndex=${i};flashFlipped=false;render()">Review</button></div>`).join('')}</div></div></div>`}
function markCard(ok){const c=state.flashcards[flashIndex%state.flashcards.length];if(!c)return;c.reviewed=(c.reviewed||0)+1;c[ok?'correct':'incorrect']=(c[ok?'correct':'incorrect']||0)+1;save();toast(ok?'Marked easy':'Marked hard');flashIndex=(flashIndex+1)%state.flashcards.length;flashFlipped=false;render()}

function startQuiz(id){const q=state.quizzes.find(x=>x.id===id);if(!q)return;currentQuiz={q,index:0,answers:[],started:Date.now()};renderQuiz()}
function renderQuiz(){const c=currentQuiz,q=c.q,qq=q.questions[c.index];showModal(q.name,`<div><div class="row"><span class="badge">Question ${c.index+1} of ${q.questions.length}</span><span class="muted">${Math.round((Date.now()-c.started)/1000)}s</span></div><h2 style="margin-top:16px">${esc(qq.question)}</h2><div class="list">${qq.options.map((o,i)=>`<button class="btn" style="text-align:left" onclick="quizAnswer(${i})">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join('')}</div></div>`,'')}
function quizAnswer(i){currentQuiz.answers[currentQuiz.index]=i;if(currentQuiz.index<currentQuiz.q.questions.length-1){currentQuiz.index++;renderQuiz()}else{finishQuiz()}}
function finishQuiz(){const c=currentQuiz,q=c.q;let correct=0;q.questions.forEach((x,i)=>{if(c.answers[i]===x.answer)correct++});const score=Math.round(correct/q.questions.length*100);state.quizResults.unshift({id:uid(),quizId:q.id,score,correct,total:q.questions.length,timeTaken:Math.round((Date.now()-c.started)/1000),date:today()});const t=topic(q.topicId);if(t){t.score=score;t.lastStudied=now();if(score<70)t.status='Needs Revision'}save();log(`Completed quiz: ${q.name}`);closeModal();toast(`Quiz completed: ${score}%`);currentQuiz=null;render()}
function createQuiz(){showModal('Create Quiz',`<form class="form"><label>Name<input id="qn" value="My Quiz"></label><label>Subject<select id="qs">${state.subjects.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></label><label>Question<input id="qq" placeholder="What should you learn?"></label><label>Option A<input id="qa"></label><label>Option B<input id="qb"></label><label>Option C<input id="qc"></label><label>Option D<input id="qd"></label><label>Correct option<select id="qcorrect"><option value="0">A</option><option value="1">B</option><option value="2">C</option><option value="3">D</option></select></label></form>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveQuiz()">Create</button>`)}
function saveQuiz(){const q={id:uid(),name:document.getElementById('qn').value,subjectId:document.getElementById('qs').value,questions:[{question:document.getElementById('qq').value,options:[qa.value,qb.value,qc.value,qd.value],answer:+qcorrect.value,explanation:'Review the topic and retry.'}]};state.quizzes.push(q);save();closeModal();toast('Quiz created');render()}

function materials(){return `<div class="toolbar"><div><div class="eyebrow">Local browser storage</div><h2>Study Materials</h2></div><label class="btn primary">+ Upload<input id="fileInput" type="file" hidden multiple onchange="uploadFiles(this.files)"></label></div><div class="notice">Files are not uploaded to a server. This page stores only metadata in LocalStorage; the browser file itself is not persisted.</div><div class="card section-gap"><div class="table-wrap"><table class="table"><thead><tr><th>File</th><th>Type</th><th>Size</th><th>Subject</th><th>Added</th><th></th></tr></thead><tbody>${state.materials.map(m=>`<tr><td><b>${esc(m.name)}</b></td><td>${esc(m.type||'')}</td><td>${Math.round(m.size/1024)} KB</td><td>${esc(subj(m.subjectId)?.name||'General')}</td><td>${m.date}</td><td><button class="btn sm danger" onclick="remove('material','${m.id}')">Delete</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">No local metadata yet.</td></tr>'}</tbody></table></div></div>`}
function uploadFiles(files){[...files].forEach(f=>state.materials.push({id:uid(),name:f.name,type:f.type,size:f.size,subjectId:'',date:today(),description:''}));save();toast(`${files.length} file metadata item(s) added`);render()}

function weak(){const w=weakTopics();return `<div class="toolbar"><div><div class="eyebrow">Personalized revision</div><h2>Weak Topics</h2></div><span class="badge">AIEngine analysis</span></div><div class="grid two"><div class="card"><h2>Topics needing attention</h2><div class="list">${w.map(x=>`<div class="item"><div class="row"><div><h3>${esc(x.name)}</h3><div class="muted">${esc(subj(x.subjectId)?.name||'')} · ${x.difficulty} · Last studied ${daysAgo(x.lastStudied)}</div></div><span class="badge danger">${x.score||0}%</span></div><div class="progress" style="margin-top:10px"><i style="width:${x.score||0}%"></i></div><div class="wrap" style="margin-top:10px"><button class="btn sm primary" onclick="startTimer('${x.subjectId}','${x.id}',45)">Practice Now</button><button class="btn sm" onclick="setPage('quizzes')">Take Quiz</button></div></div>`).join('')}</div></div><div class="card"><h2>AI recommendation</h2><p>${esc(AIEngine.recommendations())}</p><div class="item">💡 Rule-based analysis considers quiz score, difficulty, study recency, and topic progress.</div></div></div>`}
function goals(){return `<div class="toolbar"><div><div class="eyebrow">Targets</div><h2>Goals</h2></div><button class="btn primary" onclick="openForm('goal')">+ Add Goal</button></div><div class="grid three">${state.goals.map(g=>{const p=pct(g.current,g.target);return `<div class="card"><div class="row"><span class="badge">${g.type}</span><span class="muted">${g.deadline}</span></div><h3 style="margin-top:12px">${esc(g.title)}</h3><p class="muted">${esc(g.description||'')}</p><div class="row"><b>${g.current} / ${g.target}</b><b>${p}%</b></div><div class="progress"><i style="width:${p}%"></i></div><div class="row" style="margin-top:12px"><span class="badge ${p>=100?'success':'warning'}">${p>=100?'Completed':'Active'}</span><span><button class="btn sm" onclick="openForm('goal','${g.id}')">Edit</button><button class="btn sm danger" onclick="remove('goal','${g.id}')">Delete</button></span></div></div>`}).join('')}</div>`}

function progress(){return `<div class="toolbar"><div><div class="eyebrow">Analytics</div><h2>Progress</h2></div></div><div class="grid two"><div class="card"><h2>Study Time</h2><div class="chart-wrap"><canvas id="timeChart"></canvas></div></div><div class="card"><h2>Subject Distribution</h2><div class="chart-wrap"><canvas id="subjectChart"></canvas></div></div><div class="card"><h2>Quiz Performance</h2><div class="chart-wrap"><canvas id="quizChart"></canvas></div></div><div class="card"><h2>Topic Completion</h2><div class="chart-wrap"><canvas id="topicChart"></canvas></div></div></div><div class="grid three section-gap">${[['Days Studied',new Set(state.studySessions.map(x=>x.date)).size],['Days Missed',Math.max(0,30-new Set(state.studySessions.map(x=>x.date)).size)],['Longest Streak',streak()]].map(x=>`<div class="card"><div class="eyebrow">${x[0]}</div><div class="metric">${x[1]}</div></div>`).join('')}</div>`}
function drawCharts(){Object.values(charts).forEach(c=>c?.destroy());charts={};const days=[...Array(7)].map((_,i)=>{const d=new Date(Date.now()-(6-i)*86400000);return iso(d)});const vals=days.map(d=>state.studySessions.filter(x=>x.date===d).reduce((a,x)=>a+x.duration/60,0));const opts={responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true}}};const wc=document.getElementById('weeklyChart');if(wc)charts.weekly=new Chart(wc,{type:'line',data:{labels:days.map(d=>new Date(d).toLocaleDateString(undefined,{weekday:'short'})),datasets:[{label:'Hours',data:vals,tension:.35,fill:true}]},options:opts});const tc=document.getElementById('timeChart');if(tc)charts.time=new Chart(tc,{type:'bar',data:{labels:days,datasets:[{data:vals}]},options:opts});const sc=document.getElementById('subjectChart');if(sc)charts.subject=new Chart(sc,{type:'doughnut',data:{labels:state.subjects.map(x=>x.name),datasets:[{data:state.subjects.map(x=>x.studiedHours||0)}]},options:{responsive:true,maintainAspectRatio:false}});const qc=document.getElementById('quizChart');if(qc)charts.quiz=new Chart(qc,{type:'line',data:{labels:state.quizResults.slice(0,10).reverse().map(x=>x.date),datasets:[{data:state.quizResults.slice(0,10).reverse().map(x=>x.score),tension:.35}]},options:opts});const topc=document.getElementById('topicChart');if(topc)charts.topic=new Chart(topc,{type:'bar',data:{labels:state.topics.map(x=>x.name),datasets:[{data:state.topics.map(x=>x.progress)}]},options:{...opts,indexAxis:'y'}})}

function achievements(){const t=totals(),st=streak(),cards=state.flashcards.reduce((a,x)=>a+(x.reviewed||0),0),defs=[['🔥','7-Day Streak',st>=7],['📚','10 Hours Studied',t.mins>=600],['🎯','First Goal Completed',state.goals.some(g=>g.current>=g.target)],['🏆','90% Quiz Score',state.quizResults.some(r=>r.score>=90)],['⚡','25 Study Sessions',state.studySessions.length>=25],['🧠','50 Flashcards Reviewed',cards>=50],['📈','100 Topics Completed',state.topics.filter(x=>x.progress>=100).length>=100]];return `<div class="toolbar"><div><div class="eyebrow">Gamification</div><h2>Achievements</h2></div></div><div class="grid three">${defs.map(x=>`<div class="card"><div style="font-size:34px">${x[0]}</div><h3>${x[1]}</h3><span class="badge ${x[2]?'success':''}">${x[2]?'Unlocked':'Locked'}</span></div>`).join('')}</div>`}

function assistant(){return `<div class="grid two"><div class="card"><div class="row"><div><div class="eyebrow">Local intelligence</div><h2>AI Study Buddy 🤖</h2></div><span class="badge">No external AI</span></div><p class="muted">Powered by local intelligent recommendations using your saved study data.</p><div class="chat" id="chat"><div class="msg">How can I help you today?</div>${state.chatHistory?.map(m=>`<div class="msg ${m.role==='user'?'me':''}">${esc(m.text).replace(/\\n/g,'<br>')}</div>`).join('')||''}</div><div class="chat-input"><input id="chatInput" placeholder="Ask about your progress..." onkeydown="if(event.key==='Enter')askAI()"><button class="btn primary" onclick="askAI()">Send</button></div></div><div class="card"><h2>Suggested prompts</h2><div class="list">${['What should I study today?','What are my weak topics?','How am I progressing?','Create a study plan','How can I improve my quiz score?','What should I revise?'].map(q=>`<button class="item" style="text-align:left;color:var(--text)" onclick="document.getElementById('chatInput').value='${q}';askAI()">${q}</button>`).join('')}</div></div></div>`}
function askAI(){const i=document.getElementById('chatInput'),q=i?.value.trim();if(!q)return;state.chatHistory=state.chatHistory||[];state.chatHistory.push({role:'user',text:q},{role:'ai',text:AIEngine.response(q)});save();render()}
function settings(){return `<div class="toolbar"><div><div class="eyebrow">Application</div><h2>Settings</h2></div></div><div class="grid two"><div class="card"><h2>Profile</h2><form class="form" onsubmit="saveProfile(event)"><label>Name<input id="profileName" value="${esc(state.userProfile.name)}"></label><label>Target<input id="profileTarget" value="${esc(state.userProfile.target)}"></label><label>Level<select id="profileLevel">${['Beginner','Intermediate','Advanced'].map(x=>`<option ${state.userProfile.level===x?'selected':''}>${x}</option>`).join('')}</select></label><label>Weekly target (hours)<input id="weeklyTarget" type="number" min="1" value="${state.settings.weeklyTarget}"></label><button class="btn primary">Save Profile</button></form></div><div class="card"><h2>Data Management</h2><p class="muted">All study data stays in this browser.</p><div class="wrap"><button class="btn" onclick="exportData()">Export Data</button><label class="btn">Import Data<input hidden type="file" accept=".json" onchange="importData(this.files[0])"></label><button class="btn danger" onclick="resetData()">Reset Application</button></div><div class="notice" style="margin-top:14px">Reset permanently deletes your local study data.</div></div></div>`}
function saveProfile(e){e.preventDefault();state.userProfile.name=profileName.value;state.userProfile.target=profileTarget.value;state.userProfile.level=profileLevel.value;state.settings.weeklyTarget=+weeklyTarget.value;save();toast('Profile saved');render()}
function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ai-study-buddy-data.json';a.click();URL.revokeObjectURL(a.href);toast('Data exported successfully')}
function importData(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.subjects||!x.settings)throw 0;state=x;save();toast('Data imported');render()}catch(e){toast('Invalid AI Study Buddy JSON file')}};r.readAsText(file)}
function resetData(){if(!confirm('Are you sure? This will permanently delete your local study data.'))return;localStorage.removeItem(KEY);load();toast('Application reset');render()}
function notifications(){showModal('Notifications',state.notifications.map(n=>`<div class="item" style="margin-bottom:8px">${esc(n.text)}<div class="muted">${new Date(n.date).toLocaleString()}</div></div>`).join('')||'<div class="empty">No notifications.</div>')}

function render(){
 document.getElementById('avatar').textContent=(state.userProfile.name||'S')[0].toUpperCase();document.getElementById('streakTop').textContent=streak();
 const map={dashboard,subjects,planner,sessions,notes,flashcards,quizzes,materials,weak,goals,progress,achievements,assistant,settings};
 document.getElementById('view').innerHTML=(map[page]||dashboard)();renderIcons();
 if(page==='dashboard'||page==='progress')setTimeout(drawCharts,20);
 if(page==='sessions')updateTimerUI();
}
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('button[data-page]');if(b)setPage(b.dataset.page)});
document.getElementById('menu').onclick=()=>document.getElementById('sidebar').classList.toggle('open');
document.getElementById('themeBtn').onclick=()=>{state.settings.theme=state.settings.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=state.settings.theme==='dark'?'dark':'';save();render()};
document.getElementById('notifBtn').onclick=notifications;
document.getElementById('globalSearch').oninput=e=>{const q=e.target.value.toLowerCase().trim();if(!q)return;const hits=[...state.subjects.map(x=>({type:'Subject',name:x.name})),...state.topics.map(x=>({type:'Topic',name:x.name})),...state.notes.map(x=>({type:'Note',name:x.title})),...state.goals.map(x=>({type:'Goal',name:x.title}))].filter(x=>x.name.toLowerCase().includes(q)).slice(0,8);showModal('Search results',hits.map(x=>`<div class="item"><b>${esc(x.name)}</b><div class="muted">${x.type}</div></div>`).join('')||'<div class="empty">No results.</div>')};
document.getElementById('modalBack').onclick=e=>{if(e.target.id==='modalBack')closeModal()};
load();document.documentElement.dataset.theme=state.settings.theme==='dark'?'dark':'';render();
</script>
</body>
</html>
